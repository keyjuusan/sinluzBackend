[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.41", features = ["serde"] }
country-boundaries = "1.2.0"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
utoipa = { version = "6.0", features = ["axum_extras", "chrono"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.3"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.2", features = ["util"] }
